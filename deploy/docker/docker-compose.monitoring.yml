version: '3.8'

# CipherPage Observability Stack (Prometheus & Grafana)
# Conforms to SRS v2.2 OPS-09, NFR-06, AC-09

services:
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: cipherpage-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - cipherpage_net

  grafana:
    image: grafana/grafana:10.3.0
    container_name: cipherpage-grafana
    restart: unless-stopped
    ports:
      - "3001:3000" # Mapped to 3001 to avoid conflicting with Next.js on port 3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=cipheradmin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../../monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../../monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cipherpage_net

volumes:
  prometheus_data:
  grafana_data:

networks:
  cipherpage_net:
    external: true
