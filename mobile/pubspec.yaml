name: cipherpage_mobile
description: CipherPage Mobile Client - LAG: Learn, Apply, Grow
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Core networking
  dio: ^5.3.3
  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  # Local storage (for JWT tokens)
  shared_preferences: ^2.2.2
  # Video playback for 'Learn' phase
  video_player: ^2.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
