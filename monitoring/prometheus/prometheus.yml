# Prometheus Configuration for CipherPage Platform
# Conforms to SRS v2.2 OPS-09, NFR-06, AC-09

global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 5s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  # Self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # CipherPage FastAPI Backend Services
  - job_name: "cipherpage-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
    relabel_configs:
      - target_label: application
        replacement: cipherpage
      - target_label: environment
        replacement: staging
