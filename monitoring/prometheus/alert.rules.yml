# Prometheus Alerting Rules for CipherPage Platform
# Conforms to SRS v2.2 OPS-09, NFR-06

groups:
  - name: cipherpage_alerts
    rules:
      # Alert when HTTP 5xx error rate exceeds 5%
      - alert: CipherPageHighErrorRate
        expr: (sum(rate(cipherpage_http_requests_total{status_code=~"5.."}[5m])) / sum(rate(cipherpage_http_requests_total[5m]))) * 100 > 5
        for: 2m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "High HTTP 5xx error rate on CipherPage API"
          description: "Over 5% of all HTTP requests returned 5xx status codes over the last 5 minutes."

      # Alert when p95 request latency exceeds 1.5 seconds
      - alert: CipherPageHighLatency
        expr: histogram_quantile(0.95, sum(rate(cipherpage_http_request_duration_seconds_bucket[5m])) by (le)) > 1.5
        for: 3m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Elevated p95 API response latency"
          description: "95th percentile latency exceeds 1.5 seconds on CipherPage API."

      # Alert when PostgreSQL database connection is degraded
      - alert: CipherPageDatabaseDegraded
        expr: cipherpage_database_health_status == 0
        for: 1m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "PostgreSQL database health check failed"
          description: "FastAPI health probe unable to query PostgreSQL connection pool."

      # Alert when Redis cache is degraded
      - alert: CipherPageRedisDegraded
        expr: cipherpage_redis_health_status == 0
        for: 1m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis cache connection failed"
          description: "Connection to Redis Celery broker failed on CipherPage API."
