version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cipherpage-db
    environment:
      POSTGRES_USER: cipheruser
      POSTGRES_PASSWORD: cipherpassword
      POSTGRES_DB: cipherpagedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cipheruser -d cipherpagedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cipherpage_net

  redis:
    image: redis:7-alpine
    container_name: cipherpage-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cipherpage_net

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: cipherpage-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cipheruser:cipherpassword@db:5432/cipherpagedb
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - cipherpage_net

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cipherpage-celery-worker
    # Command scales background task processing (e.g., grading code submissions)
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://cipheruser:cipherpassword@db:5432/cipherpagedb
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Verifies celery worker is active and accepting tasks
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cipherpage_net

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: cipherpage-web
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - cipherpage_net

volumes:
  postgres_data:

networks:
  cipherpage_net:
    driver: bridge
