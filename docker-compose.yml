services:
  redis:
    image: redis:7-alpine
    container_name: cipherpage-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cipherpage_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: cipherpage-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - cipherpage_net

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: cipherpage-celery-worker
    # Command scales background task processing (e.g., grading code submissions)
    command: celery -A app.workers.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
      # Only the trusted grading worker needs to launch isolated execution containers.
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ./backend/.env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Verifies celery worker is active and accepting tasks
      test: [ "CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cipherpage_net

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: development
    container_name: cipherpage-web
    command: npm run dev -- -H 0.0.0.0
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file:
      - ./web/.env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000" ]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - cipherpage_net

networks:
  cipherpage_net:
    driver: bridge
